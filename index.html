<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroLabor GIS</title>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Work Sans', sans-serif; background: #f5f5f5; }
        
        .auth-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a3009 0%, #2d5016 100%);
            padding: 2rem;
        }
        .auth-card {
            background: white;
            border-radius: 20px;
            padding: 3rem;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .auth-logo { text-align: center; margin-bottom: 2rem; }
        .auth-logo-icon { font-size: 4rem; margin-bottom: 1rem; }
        .auth-title { font-family: 'Crimson Pro', serif; font-size: 2.5rem; color: #2d5016; margin-bottom: 0.5rem; }
        .auth-subtitle { color: #666; font-size: 1rem; }
        .auth-tabs { display: flex; gap: 0.5rem; margin-bottom: 2rem; border-bottom: 2px solid #e0e0e0; }
        .auth-tab {
            flex: 1; padding: 1rem; background: transparent; border: none; cursor: pointer;
            font-weight: 600; color: #666; border-bottom: 3px solid transparent; margin-bottom: -2px;
        }
        .auth-tab.active { color: #2d5016; border-bottom-color: #2d5016; }
        .auth-form { display: none; }
        .auth-form.active { display: block; }
        .form-group { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1rem; }
        .form-label { font-weight: 600; color: #2a2a2a; font-size: 0.9rem; }
        .form-input {
            padding: 0.75rem 1rem; border: 2px solid #e0e0e0; border-radius: 8px;
            font-size: 0.95rem; font-family: 'Work Sans', sans-serif;
        }
        .form-input:focus { outline: none; border-color: #2d5016; }
        .btn {
            padding: 0.75rem 1.5rem; border: none; border-radius: 8px;
            font-weight: 600; cursor: pointer; font-size: 0.95rem; font-family: 'Work Sans', sans-serif;
        }
        .btn-primary { background: #2d5016; color: white; width: 100%; }
        .btn-primary:hover { background: #1a3009; }
        .alert {
            padding: 1rem; border-radius: 8px; margin-bottom: 1rem; border-left: 4px solid;
        }
        .alert-success { background: rgba(74,124,42,0.1); border-color: #4a7c2a; color: #4a7c2a; }
        .alert-error { background: rgba(201,76,76,0.1); border-color: #c94c4c; color: #c94c4c; }
        .hidden { display: none !important; }
        
        .main-app { min-height: 100vh; background: #faf8f3; }
        .header {
            background: #2d5016; color: white; padding: 1.5rem 2rem;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }
        .header-content {
            max-width: 1400px; margin: 0 auto;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-family: 'Crimson Pro', serif; font-size: 1.8rem; font-weight: 700; }
        .btn-logout {
            background: rgba(255,255,255,0.2); color: white;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer;
        }
        .btn-logout:hover { background: rgba(255,255,255,0.3); }
        .main-content { max-width: 1400px; margin: 0 auto; padding: 2rem; }
        .welcome-card {
            background: white; padding: 3rem; border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center;
        }
        .welcome-card h1 { color: #2d5016; margin-bottom: 1rem; font-family: 'Crimson Pro', serif; }
        .welcome-card p { color: #666; font-size: 1.1rem; }
        .status-badge {
            display: inline-block; padding: 0.5rem 1rem; border-radius: 20px;
            background: #4a7c2a; color: white; font-weight: 600; margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div id="authScreen" class="auth-screen">
        <div class="auth-card">
            <div class="auth-logo">
                <div class="auth-logo-icon">🌾</div>
                <h1 class="auth-title">AgroLabor GIS</h1>
                <p class="auth-subtitle">Sistema de Gestión Agrícola</p>
            </div>

            <div class="auth-tabs">
                <button class="auth-tab active" id="tabLogin">Iniciar Sesión</button>
                <button class="auth-tab" id="tabRegister">Registrarse</button>
            </div>

            <div id="loginForm" class="auth-form active">
                <div id="loginAlert"></div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="loginEmail" class="form-input" placeholder="tu@email.com">
                </div>
                <div class="form-group">
                    <label class="form-label">Contraseña</label>
                    <input type="password" id="loginPassword" class="form-input" placeholder="••••••••">
                </div>
                <button class="btn btn-primary" id="btnLogin">Iniciar Sesión</button>
            </div>

            <div id="registerForm" class="auth-form">
                <div id="registerAlert"></div>
                <div class="form-group">
                    <label class="form-label">Nombre Completo</label>
                    <input type="text" id="registerName" class="form-input" placeholder="Juan Pérez">
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="registerEmail" class="form-input" placeholder="tu@email.com">
                </div>
                <div class="form-group">
                    <label class="form-label">Contraseña</label>
                    <input type="password" id="registerPassword" class="form-input" placeholder="Mínimo 6 caracteres">
                </div>
                <div class="form-group">
                    <label class="form-label">Confirmar Contraseña</label>
                    <input type="password" id="registerPasswordConfirm" class="form-input" placeholder="Repite tu contraseña">
                </div>
                <button class="btn btn-primary" id="btnRegister">Crear Cuenta</button>
            </div>
        </div>
    </div>

    <div id="mainApp" class="main-app hidden">
        <div class="header">
            <div class="header-content">
                <div class="logo">🌾 AgroLabor GIS</div>
                <div>
                    <span id="userName" style="margin-right: 1rem;"></span>
                    <button class="btn-logout" id="btnLogout">Cerrar Sesión</button>
                </div>
            </div>
        </div>
        <div class="main-content">
            <div class="welcome-card">
                <h1>¡Bienvenido a AgroLabor GIS!</h1>
                <p>Has iniciado sesión correctamente.</p>
                <div class="status-badge">✓ Sistema Funcionando</div>
                <p style="margin-top: 2rem; color: #666; font-size: 0.9rem;">
                    Login y Registro operativos • Base de datos conectada • Listo para usar
                </p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Variables con nombres únicos para evitar conflictos
        var clienteSupabase = null;
        var usuarioActual = null;
        var configuracionCargada = false;

        // Función para mostrar alertas
        function mostrarAlerta(contenedorId, mensaje, tipo) {
            const contenedor = document.getElementById(contenedorId);
            if (contenedor) {
                contenedor.innerHTML = '<div class="alert alert-' + tipo + '">' + mensaje + '</div>';
                setTimeout(function() {
                    contenedor.innerHTML = '';
                }, 5000);
            }
        }

        // Cambiar entre tabs de login/registro
        function configurarTabs() {
            document.getElementById('tabLogin').addEventListener('click', function() {
                document.querySelectorAll('.auth-tab').forEach(function(t) { t.classList.remove('active'); });
                document.querySelectorAll('.auth-form').forEach(function(f) { f.classList.remove('active'); });
                this.classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            });

            document.getElementById('tabRegister').addEventListener('click', function() {
                document.querySelectorAll('.auth-tab').forEach(function(t) { t.classList.remove('active'); });
                document.querySelectorAll('.auth-form').forEach(function(f) { f.classList.remove('active'); });
                this.classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            });
        }

        // Función de Login
        function configurarLogin() {
            document.getElementById('btnLogin').addEventListener('click', function() {
                console.log('👤 Intentando login...');
                
                var email = document.getElementById('loginEmail').value.trim();
                var password = document.getElementById('loginPassword').value;

                if (!email || !password) {
                    mostrarAlerta('loginAlert', '⚠️ Completa todos los campos', 'error');
                    return;
                }

                if (!clienteSupabase) {
                    mostrarAlerta('loginAlert', '⚠️ Supabase no inicializado. Recarga la página.', 'error');
                    return;
                }

                clienteSupabase.auth.signInWithPassword({ 
                    email: email, 
                    password: password 
                }).then(function(resultado) {
                    if (resultado.error) {
                        console.error('❌ Error login:', resultado.error);
                        mostrarAlerta('loginAlert', '❌ ' + resultado.error.message, 'error');
                    } else {
                        usuarioActual = resultado.data.user;
                        console.log('✅ Login exitoso:', usuarioActual.email);
                        mostrarAlerta('loginAlert', '✓ Iniciando sesión...', 'success');
                        
                        setTimeout(function() {
                            document.getElementById('authScreen').classList.add('hidden');
                            document.getElementById('mainApp').classList.remove('hidden');
                            document.getElementById('userName').textContent = usuarioActual.email;
                        }, 500);
                    }
                });
            });
        }

        // Función de Registro
        function configurarRegistro() {
            document.getElementById('btnRegister').addEventListener('click', function() {
                console.log('📝 Intentando registro...');
                
                var nombre = document.getElementById('registerName').value.trim();
                var email = document.getElementById('registerEmail').value.trim();
                var password = document.getElementById('registerPassword').value;
                var passwordConfirm = document.getElementById('registerPasswordConfirm').value;

                if (!nombre || !email || !password || !passwordConfirm) {
                    mostrarAlerta('registerAlert', '⚠️ Completa todos los campos', 'error');
                    return;
                }

                if (password !== passwordConfirm) {
                    mostrarAlerta('registerAlert', '⚠️ Las contraseñas no coinciden', 'error');
                    return;
                }

                if (password.length < 6) {
                    mostrarAlerta('registerAlert', '⚠️ La contraseña debe tener mínimo 6 caracteres', 'error');
                    return;
                }

                if (!clienteSupabase) {
                    mostrarAlerta('registerAlert', '⚠️ Supabase no inicializado. Recarga la página.', 'error');
                    return;
                }

                clienteSupabase.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            full_name: nombre
                        }
                    }
                }).then(function(resultado) {
                    if (resultado.error) {
                        console.error('❌ Error registro:', resultado.error);
                        mostrarAlerta('registerAlert', '❌ ' + resultado.error.message, 'error');
                    } else {
                        console.log('✅ Registro exitoso');
                        mostrarAlerta('registerAlert', '✓ Cuenta creada! Ahora puedes iniciar sesión.', 'success');
                        
                        setTimeout(function() {
                            document.getElementById('tabLogin').click();
                            document.getElementById('loginEmail').value = email;
                        }, 2000);
                    }
                });
            });
        }

        // Función de Logout
        function configurarLogout() {
            document.getElementById('btnLogout').addEventListener('click', function() {
                if (confirm('¿Cerrar sesión?')) {
                    if (clienteSupabase) {
                        clienteSupabase.auth.signOut();
                    }
                    usuarioActual = null;
                    document.getElementById('mainApp').classList.add('hidden');
                    document.getElementById('authScreen').classList.remove('hidden');
                    document.getElementById('loginEmail').value = '';
                    document.getElementById('loginPassword').value = '';
                    console.log('👋 Sesión cerrada');
                }
            });
        }

        // Cargar configuración desde config.js
        function cargarConfiguracion() {
            return new Promise(function(resolve, reject) {
                var script = document.createElement('script');
                script.src = 'config.js';
                
                script.onerror = function() {
                    console.error('❌ No se pudo cargar config.js');
                    alert('ERROR: No se encontró el archivo config.js\n\nAsegúrate de que está en la misma carpeta que este HTML.');
                    reject(new Error('config.js no encontrado'));
                };
                
                script.onload = function() {
                    if (typeof SUPABASE_CONFIG === 'undefined') {
                        console.error('❌ config.js no tiene SUPABASE_CONFIG');
                        alert('ERROR: config.js no contiene SUPABASE_CONFIG');
                        reject(new Error('SUPABASE_CONFIG no definido'));
                        return;
                    }

                    var url = SUPABASE_CONFIG.url;
                    var anonKey = SUPABASE_CONFIG.anonKey;
                    
                    if (!url || !anonKey || url.indexOf('tu-proyecto') !== -1 || anonKey.indexOf('tu-anon-key') !== -1) {
                        console.error('❌ Credenciales no configuradas');
                        alert('ERROR: Debes configurar tus credenciales en config.js\n\n1. Abre config.js\n2. Ve a supabase.com\n3. Copia tu URL y anon key\n4. Pégalos en config.js\n5. Guarda y recarga');
                        reject(new Error('Credenciales no configuradas'));
                        return;
                    }

                    console.log('✅ Configuración cargada correctamente');
                    configuracionCargada = true;
                    resolve({url: url, anonKey: anonKey});
                };
                
                document.head.appendChild(script);
            });
        }

        // Inicializar aplicación
        window.addEventListener('load', function() {
            console.log('🚀 Iniciando AgroLabor GIS...');
            
            cargarConfiguracion().then(function(config) {
                console.log('🔌 Conectando a Supabase...');
                
                try {
                    clienteSupabase = window.supabase.createClient(config.url, config.anonKey);
                    console.log('✅ Supabase inicializado correctamente');
                    
                    // Configurar event listeners
                    configurarTabs();
                    configurarLogin();
                    configurarRegistro();
                    configurarLogout();
                    
                    // Verificar si hay sesión activa
                    clienteSupabase.auth.getSession().then(function(resultado) {
                        if (resultado.data && resultado.data.session) {
                            usuarioActual = resultado.data.session.user;
                            console.log('✅ Sesión existente encontrada:', usuarioActual.email);
                            document.getElementById('authScreen').classList.add('hidden');
                            document.getElementById('mainApp').classList.remove('hidden');
                            document.getElementById('userName').textContent = usuarioActual.email;
                        } else {
                            console.log('ℹ️ No hay sesión activa');
                        }
                    });
                    
                    console.log('✅ Aplicación lista');
                    
                } catch (error) {
                    console.error('❌ Error al inicializar Supabase:', error);
                    alert('ERROR al inicializar Supabase: ' + error.message);
                }
                
            }).catch(function(error) {
                console.error('❌ Error al cargar configuración:', error);
            });
        });
    </script>
</body>
</html>
